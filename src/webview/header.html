<header class="top-header">
  <div class="left">
    <img class="logo" src="%%UNIRTOS_ICON%%" alt="UniRTOS logo">
    <h1>UniRTOS</h1>
  </div>
  <div class="center">
    <div id="page-title"><strong id="page-title-value">—</strong></div>
  </div>
  <div class="right"><a class="home-button" href="https://developer.quectel.com/en/" target="_blank" rel="noopener">Home</a></div>
</header>
<link rel="stylesheet" href="%%HEADER_CSS%%">

<script>
  window.addEventListener('message', event => {
    try {
      const msg = event.data;
      if (!msg || !msg.type) return;
      switch (msg.type) {
        case 'setUniRTOSProject': {
          const val = !!msg.value;
          const el = document.getElementById('unirtos-project-value');
          if (el) {
            el.textContent = val ? 'Yes' : 'No';
            el.className = val ? 'status-yes' : 'status-no';
          }
          break;
        }
        case 'setPageTitle': {
          const title = msg.value == null ? '' : String(msg.value);
          const el = document.getElementById('page-title-value');
          if (el) el.textContent = title || '—';
          break;
        }
        case 'theme': {
          const theme = msg.theme === 'light' ? 'light' : 'dark';
          try {
            document.documentElement.setAttribute('data-theme', theme);
            // Force a light, grey header when VS Code is in dark theme
            try {
              const headerEl = document.querySelector('.top-header');
              const titleEl = headerEl ? headerEl.querySelector('h1') : null;
              const pageTitleEl = document.getElementById('page-title');
              const cs = getComputedStyle(document.documentElement);
                if (theme === 'dark') {
                const lightGrey = '#8c8c8c';
                const titleColor = cs.getPropertyValue('--header-title')?.trim() || '#0066cc';
                const pageTitleColor = cs.getPropertyValue('--text-color')?.trim() || '#333333';
                if (headerEl) headerEl.style.backgroundColor = lightGrey;
                if (titleEl) titleEl.style.color = titleColor;
                if (pageTitleEl) pageTitleEl.style.color = pageTitleColor;
              } else {
                // light theme: use defined CSS variables
                const headerBg = cs.getPropertyValue('--header-bg')?.trim() || '';
                const titleColor = cs.getPropertyValue('--header-title')?.trim() || '';
                const pageTitleColor = cs.getPropertyValue('--text-color')?.trim() || '';
                if (headerEl) headerEl.style.backgroundColor = headerBg || '';
                if (titleEl && titleColor) titleEl.style.color = titleColor;
                if (pageTitleEl && pageTitleColor) pageTitleEl.style.color = pageTitleColor;
              }
            } catch (e) {}
          } catch (e) {}
          break;
        }
        default:
          break;
      }
    } catch (e) {
      console.warn('header: failed to handle message', e);
    }
  });
</script>
