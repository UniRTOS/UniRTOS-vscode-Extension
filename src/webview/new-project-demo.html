<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Project Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial; padding: 12px; }
    .row { margin-bottom: 8px; }
    label { display:block; font-weight:600; margin-bottom:4px }
    select, button { width:80%; padding:8px; }
    /* Shared control sizing to match new-project layout */
    .field-control { width:100%; padding:8px; box-sizing:border-box; }
    .field-group { display:flex; gap:8px; width:100%; }
    .left-column { flex:1 1 0; min-width:0; max-width:520px }
    .right-column { width:260px }
    .actions { display:flex; gap:8px; margin-top:12px }
    .actions button { flex:1 }
    /* Header styles moved to src/webview/header.html for reuse */
    h1 { color: #0066cc }
  </style>
</head>
<body>
  <div id="header-root"></div>
  <h1>New Project — Demo</h1>
  <div class="row" style="width:80%;">
    <label style="display:flex; align-items:center; gap:8px; font-weight:500;">
      <span style="position:relative;display:inline-block;">
        <input id="toggle-current-workspace" type="checkbox" style="width:auto;position:relative;z-index:1;" />
      </span>
      Use current workspace and folder
    </label>
  </div>
  <div class="use-current-workspace">
    <div class="row">
      <div style="display:flex;align-items:flex-start;gap:20px;width:100%">
        <div class="left-column" style="display:flex;flex-direction:column;">
          <label for="projectName">Project name</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="projectName" type="text" placeholder="Enter project name" class="field-control" style="flex:1 1 0;" />
          </div>
        </div>
        <div class="right-column" style="display:flex;flex-direction:column;">
          <label for="model">Model</label>
          <select id="model" class="field-control"><option value="">— none —</option></select>
        </div>
        <div class="right-column" style="display:flex;flex-direction:column;">
            <label for="demo-projects">Demo Project</label>
            <select id="demo-projects" class="keep-enabled" aria-label="Demo projects" style="width:220px;padding:8px;box-sizing:border-box"></select>
        </div>
      </div>
    </div>
    <div class="row">
      <label for="targetDir">Save location (where SDK will be cloned)</label>
      <div class="field-group" style="max-width:520px;">
        <input id="targetDir" type="text" style="flex:1 1 0;padding:8px;box-sizing:border-box;max-width:320px" placeholder="Select folder..." />
        <button id="choose-dir" style="width:120px">Choose...</button>
      </div>
    </div>
  </div>

  <div class="row">
    <label for="sdkVersion">SDK version</label>
    <select id="sdkVersion" style="flex:1 1 0;padding:8px;box-sizing:border-box;max-width:320px">
      <option value="v1.0" selected>v1.0</option>
      <option value="v1.1" hidden>v1.1</option>
      <option value="v2.0" hidden>v2.0</option>
    </select>
  </div>
  <div class="actions" style="max-width:520px;">
    <button id="create">Create Demo Project</button>
  </div>

  <!--PROJECTS_SCRIPT-->
  <script>
    (function() {
      const vscode = acquireVsCodeApi();
      const select = document.getElementById('demo-projects');
      const localProjectContainer = document.querySelector('.use-current-workspace');
      const localProjectToggle = document.getElementById('toggle-current-workspace');

      function setLocalProjectEnabled(enabled) {
        if (!localProjectContainer) {
          return;
        }

        const disabled = enabled;
        const controls = localProjectContainer.querySelectorAll('input, button, select, textarea');
        controls.forEach(control => {
          if (control.classList && control.classList.contains('keep-enabled')) return;
          control.disabled = disabled;
          control.style.opacity = disabled ? '0.55' : '1';
        });
      }

      if (localProjectToggle) {
        setLocalProjectEnabled(localProjectToggle.checked);
        localProjectToggle.addEventListener('change', (e) => {
          setLocalProjectEnabled(e.target.checked);
        });
      }

      // notify extension this demo webview is ready to receive platforms/models
      vscode.postMessage({ type: 'ready' });

      // platform selection removed; extension will provide models directly

      const chooseDirBtn = document.getElementById('choose-dir');
      const targetDirInput = document.getElementById('targetDir');
      if (chooseDirBtn) {
        chooseDirBtn.addEventListener('click', () => {
          vscode.postMessage({ type: 'chooseDir' });
        });
      }

      document.getElementById('create').addEventListener('click', () => {
        const selected = select ? select.value : null;
        const useCurrent = localProjectToggle ? localProjectToggle.checked : true;
        const projectNameInput = document.getElementById('projectName');
        const targetDirInput = document.getElementById('targetDir');
        const modelSel = document.getElementById('model');

        const payload = { name: selected || 'demo-project' };
        if (!useCurrent) {
          payload['projectName'] = projectNameInput ? projectNameInput.value : '';
          payload['targetDir'] = targetDirInput ? targetDirInput.value : '';
          payload['model'] = modelSel ? modelSel.value : '';
        }

        if (window && window.acquireVsCodeApi) {
            console.log('new-project-demo: posting createDemo', payload);
            vscode.postMessage({ type: 'createDemo', payload });
          }
      });

      // accept messages from extension to populate UI
      window.addEventListener('message', event => {
        const msg = event.data;
        // platform list not used in single-platform setup

        if (msg.type === 'setModels') {
          const modelSel = document.getElementById('model');
          if (modelSel) {
            modelSel.innerHTML = '';
            (msg.models || []).forEach(m => {
              const opt = document.createElement('option'); opt.value = m; opt.textContent = m; modelSel.appendChild(opt);
            });
            if (msg.models && msg.models.length > 0) {
              modelSel.value = msg.models[0];
            }
          }
        }

        if (msg.type === 'setModelValue') {
          const modelSel = document.getElementById('model');
          if (modelSel && typeof msg.value === 'string' && msg.value.length > 0) {
            // ensure option exists
            let exists = false;
            for (let i = 0; i < modelSel.options.length; i++) {
              if (modelSel.options[i].value === msg.value) { exists = true; break; }
            }
            if (!exists) {
              const opt = document.createElement('option'); opt.value = msg.value; opt.textContent = msg.value; modelSel.insertBefore(opt, modelSel.firstChild);
            }
            modelSel.value = msg.value;
          }
        }

        if (msg.type === 'setTargetDir' && targetDirInput) {
          targetDirInput.value = msg.value || '';
        }
      });

      // If the extension injected `window.__demoProjects` before script ran, populate now
      try {
        const projects = window.__demoProjects || [];
        if (select && Array.isArray(projects)) {
          projects.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id || p.name || p;
            opt.textContent = p.name || p;
            select.appendChild(opt);
          });
        }
      } catch (e) {
        // ignore
      }
    })();
  </script>
</body>
</html>
