<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; script-src 'unsafe-inline' vscode-resource:; style-src 'unsafe-inline' vscode-resource:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New UniRTOS Project</title>
  
</head>
<body>
  <div id="header-root"></div>
  <h1>New UniRTOS Project</h1>
  <div class="row">
      <div class="flex flex-start gap-20 full-width">
        <div class="column col-flex">
          <label for="projectName">Project name</label>
          <div class="input-with-button">
            <input id="projectName" type="text" placeholder="Enter project name" class="input-field" />
            <button id="open-demo" class="btn-120">Demo projects</button>
          </div>
        </div>
        <div class="column width-260">
          <label for="module">module</label>
          <select id="module" class="select-full"></select>
        </div>
      </div>
  </div>
  <div class="row">
    <label for="targetDir">Save location (where SDK will be cloned)</label>
    <div class="input-with-button">
      <input id="targetDir" type="text" readonly class="input-field" placeholder="Select folder..." />
      <button id="choose-dir" class="btn-120">Choose...</button>
    </div>
  </div>
  <div class="row">
    <label for="sdkVersion">SDK version</label>
    <select id="sdkVersion" class="input-field">
      <option value="v1.0" selected>v1.0</option>
      <option value="v1.1" hidden>v1.1</option>
      <option value="v2.0" hidden>v2.0</option>
    </select>
  </div>

  <div class="actions max-440">
    <button id="cancel">Cancel</button>
    <button id="create">Create Project</button>
  </div>

  <script>
    const vscode = acquireVsCodeApi();

    // request platforms data from extension
    vscode.postMessage({ type: 'ready' });

    document.getElementById('cancel').addEventListener('click', () => {
      vscode.postMessage({ type: 'cancel' });
    });

    document.getElementById('open-demo').addEventListener('click', () => {
      vscode.postMessage({ type: 'openDemo' });
    });

    document.getElementById('choose-dir').addEventListener('click', () => {
      vscode.postMessage({ type: 'chooseDir' });
    });

    document.getElementById('create').addEventListener('click', () => {
      const module = document.getElementById('module').value;
      const projectName = document.getElementById('projectName').value.trim();
      const sdkVersion = document.getElementById('sdkVersion').value;
      const targetDir = document.getElementById('targetDir').value;

      const missing = [];
      if (!module) missing.push('module');
      if (!projectName) missing.push('project name');
      if (!targetDir) missing.push('save location');

      if (missing.length > 0) {
        vscode.postMessage({ type: 'showMessage', level: 'warning', text: `Please provide: ${missing.join(', ')}` });
        return;
      }

      vscode.postMessage({ type: 'create', module: module, projectName: projectName, sdkVersion: sdkVersion, targetDir: targetDir });
    });

    // accept messages from extension to populate UI
    window.addEventListener('message', event => {
      const msg = event.data;
      // platform list not used in single-platform setup
      if (msg.type === 'setModules') {
        const moduleSel = document.getElementById('module');
        moduleSel.innerHTML = '';
        msg.modules.forEach((m) => {
          const opt = document.createElement('option'); opt.value = m; opt.textContent = m; moduleSel.appendChild(opt);
        });
        if (msg.modules && msg.modules.length > 0) {
          moduleSel.value = msg.modules[0];
        }
      }
      if (msg.type === 'setTargetDir') {
        const input = document.getElementById('targetDir');
        if (input) input.value = msg.path || '';
      }
    });
  </script>
</body>
</html>
