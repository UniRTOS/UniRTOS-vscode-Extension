<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; script-src 'unsafe-inline' vscode-resource:; style-src 'unsafe-inline' vscode-resource:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New UniRTOS Project</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial; padding: 12px; }
    .row { margin-bottom: 8px; }
    label { display:block; font-weight:600; margin-bottom:4px }
    select, button { width:80%; padding:8px; }
    .actions { display:flex; gap:8px; margin-top:12px }
    .actions button { flex:1 }
    h1 { color: #0066cc }
  </style>
</head>
<body>
  <div id="header-root"></div>
  <h1>New UniRTOS Project</h1>
  <div class="row">
      <div style="display:flex;align-items:flex-start;gap:20px;width:100%">
        <div style="display:flex;flex-direction:column;flex:1 1 0;min-width:0;max-width:520px">
          <label for="projectName">Project name</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="projectName" type="text" placeholder="Enter project name" style="flex:1 1 0;padding:8px;box-sizing:border-box;max-width:320px" />
            <button id="open-demo" style="width:120px">Demo projects</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;width:260px">
          <label for="model">Model</label>
          <select id="model" style="width:100%;padding:8px;box-sizing:border-box"></select>
        </div>
      </div>
  </div>
  <div class="row">
    <label for="targetDir">Save location (where SDK will be cloned)</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="targetDir" type="text" readonly style="flex:1 1 0;padding:8px;box-sizing:border-box;max-width:320px" placeholder="Select folder..." />
      <button id="choose-dir" style="width:120px">Choose...</button>
    </div>
  </div>
  <div class="row">
    <label for="sdkVersion">SDK version</label>
    <select id="sdkVersion" style="flex:1 1 0;padding:8px;box-sizing:border-box;max-width:320px">
      <option value="v1.0" selected>v1.0</option>
      <option value="v1.1" hidden>v1.1</option>
      <option value="v2.0" hidden>v2.0</option>
    </select>
  </div>

  <div class="actions" style="max-width:440px;">
    <button id="cancel">Cancel</button>
    <button id="create">Continue</button>
  </div>

  <script>
    const vscode = acquireVsCodeApi();

    // request platforms data from extension
    vscode.postMessage({ type: 'ready' });

    document.getElementById('cancel').addEventListener('click', () => {
      vscode.postMessage({ type: 'cancel' });
    });

    document.getElementById('open-demo').addEventListener('click', () => {
      vscode.postMessage({ type: 'openDemo' });
    });

    document.getElementById('choose-dir').addEventListener('click', () => {
      vscode.postMessage({ type: 'chooseDir' });
    });

    document.getElementById('create').addEventListener('click', () => {
      const model = document.getElementById('model').value;
      const projectName = document.getElementById('projectName').value.trim();
      const sdkVersion = document.getElementById('sdkVersion').value;
      const targetDir = document.getElementById('targetDir').value;

      const missing = [];
      if (!model) missing.push('model');
      if (!projectName) missing.push('project name');
      if (!targetDir) missing.push('save location');

      if (missing.length > 0) {
        vscode.postMessage({ type: 'showMessage', level: 'warning', text: `Please provide: ${missing.join(', ')}` });
        return;
      }

      vscode.postMessage({ type: 'create', model: model, projectName: projectName, sdkVersion: sdkVersion, targetDir: targetDir });
    });

    // accept messages from extension to populate UI
    window.addEventListener('message', event => {
      const msg = event.data;
      // platform list not used in single-platform setup
      if (msg.type === 'setModels') {
        const modelSel = document.getElementById('model');
        modelSel.innerHTML = '';
        msg.models.forEach((m) => {
          const opt = document.createElement('option'); opt.value = m; opt.textContent = m; modelSel.appendChild(opt);
        });
        if (msg.models && msg.models.length > 0) {
          modelSel.value = msg.models[0];
        }
      }
      if (msg.type === 'setTargetDir') {
        const input = document.getElementById('targetDir');
        if (input) input.value = msg.path || '';
      }
    });
  </script>
</body>
</html>
