<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; script-src 'unsafe-inline' vscode-resource:; style-src 'unsafe-inline' vscode-resource:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniRTOS Flash Firmware</title>
</head>
<body>
  <div id="header-root"></div>
  <div id="flashNotice" class="notice">Flashing completed successfully.</div>
  <div id="flashError" class="notice error">Flashing failed.</div>
  <h1>Flash UniRTOS Firmware</h1>

  <pre id="portsDebug" class="ports-debug"></pre>

  <section id="tab3" class="tab-panel active">
    <div class="summary">
      <div class="content-max600">
        
        <div class="summary-row">
          <div class="field-label">COM port:</div>
          <select id="portSelect" class="port-select">
            <option value="">(scanning...)</option>
          </select>
          <button id="refreshPorts" class="small-btn">Refresh Ports</button>
        </div>
        
        <div class="summary-row">
          <div class="field-label">Location:</div>
          <input id="selectedFilePath" class="file-summary" readonly title="(none)" value="(none)" />
          <button id="selectFileBtn" class="small-btn">Select File</button>
        </div>
        
      </div>
    </div>
  </section>

  <div class="flash-actions actions max-220">
    <button id="flashBtn" class="small-btn">Flash Firmware</button>
  </div>

  <script>
    const vscode = typeof acquireVsCodeApi !== 'undefined' ? acquireVsCodeApi() : null;
    const panels = Array.from(document.querySelectorAll('.tab-panel'));
    if (vscode && panels.length === 1) {
      vscode.postMessage({ command: 'requestPorts' });
    }

    let selectedPort = '';
    let selectedFile = '';
    let selectedPkg = '';
    let preFlashCheck = false;
    let preFlashTimeoutId = null;
    let uniRTOSState = undefined; // undefined = unknown, true = is UniRTOS project, false = not

    function triggerFlash() {
      // First, ensure the current workspace is a UniRTOS SDK project
      const errEl = document.getElementById('flashError');
      if (typeof uniRTOSState !== 'undefined' && uniRTOSState === false) {
        if (errEl) {
          errEl.textContent = 'Workspace is not a UniRTOS SDK project!';
          errEl.style.display = 'block';
          setTimeout(() => { if (errEl) errEl.style.display = 'none'; }, 6000);
        }
        return;
      }
      if (typeof uniRTOSState === 'undefined') {
        // request status from extension and ask user to retry after it's resolved
        try { if (vscode) vscode.postMessage({ command: 'requestProjectStatus' }); } catch (e) {}
        if (errEl) {
          errEl.textContent = 'Checking workspace type — please try again in a moment.';
          errEl.style.display = 'block';
          setTimeout(() => { if (errEl) errEl.style.display = 'none'; }, 4000);
        }
        return;
      }
      // Validate required inputs before asking the extension to flash
      if (!selectedPort) {
        if (errEl) {
          errEl.textContent = 'Please select a COM port.';
          errEl.style.display = 'block';
          setTimeout(() => { if (errEl) errEl.style.display = 'none'; }, 5000);
        }
        return;
      }
      // Verify the selected port corresponds to a QDLoader device
      try {
        const portSel = document.getElementById('portSelect');
        let selectedLabel = '';
        if (portSel && portSel.options && portSel.selectedIndex >= 0) {
          selectedLabel = portSel.options[portSel.selectedIndex].text || '';
        }
        if (selectedLabel && !/qdloader/i.test(selectedLabel)) {
          if (errEl) {
            errEl.textContent = 'Selected port is not QDLoader. Please select the QDLoader port.';
            errEl.style.display = 'block';
            setTimeout(() => { if (errEl) errEl.style.display = 'none'; }, 6000);
          }
          return;
        }
      } catch (e) {}
      // Ensure a file has been selected
      if (!selectedFile) {
        if (errEl) {
          errEl.textContent = 'Please select a file to flash.';
          errEl.style.display = 'block';
          setTimeout(() => { if (errEl) errEl.style.display = 'none'; }, 5000);
        }
        return;
      }
      // Before flashing, request fresh port list and verify QDLoader is present.
      // The extension will respond with a 'ports' message which we handle below.
      if (vscode) {
        preFlashCheck = true;
        try { vscode.postMessage({ command: 'requestPorts', preFlashCheck: true }); } catch (e) {}
        if (preFlashTimeoutId) clearTimeout(preFlashTimeoutId);
        preFlashTimeoutId = setTimeout(() => {
          preFlashCheck = false;
          const err = document.getElementById('flashError');
          if (err) {
            err.textContent = 'qdloader port is avilable for 15 sec or less, please try again';
            err.style.display = 'block';
            setTimeout(() => { if (err) err.style.display = 'none'; }, 6000);
          }
        }, 15000);
      }
    }

    window.addEventListener('message', event => {
      const msg = event.data;
      if (msg && msg.type === 'setUniRTOSProject') {
        uniRTOSState = !!msg.value;
        return;
      }
      if (msg && msg.command === 'ports') {
        const select = document.getElementById('portSelect');
        if (!select) return;
        select.innerHTML = '';
        const ports = Array.isArray(msg.ports) ? msg.ports : [];
        if (ports.length === 0) {
          const opt = document.createElement('option'); opt.value = ''; opt.textContent = '(no ports found)'; select.appendChild(opt);
          // If we were checking for QDLoader for a pending flash, show message
          if (preFlashCheck) {
            preFlashCheck = false;
            if (preFlashTimeoutId) { clearTimeout(preFlashTimeoutId); preFlashTimeoutId = null; }
            const err = document.getElementById('flashError');
            if (err) {
              err.textContent = 'qdloader port is avilable for 15 sec or less, please try again';
              err.style.display = 'block';
              setTimeout(() => { if (err) err.style.display = 'none'; }, 6000);
            }
          }
        } else {
          for (const p of ports) {
            const opt = document.createElement('option'); opt.value = p.value || p.label || ''; opt.textContent = p.label || p.value || p;
            select.appendChild(opt);
          }
          selectedPort = select.value || (select.options && select.options.length > 0 ? select.options[0].value : '');
          // If this ports list was requested as part of a pre-flash check, look for QDLoader
          if (preFlashCheck) {
            preFlashCheck = false;
            if (preFlashTimeoutId) { clearTimeout(preFlashTimeoutId); preFlashTimeoutId = null; }
            try {
              const qd = ports.find(p => (p.label || '').toLowerCase().includes('qdloader')) || ports.find(p => (p.value || '').toLowerCase().includes('qdloader'));
              if (!qd) {
                const err = document.getElementById('flashError');
                if (err) {
                  err.textContent = 'qdloader port is avilable for 15 sec or less, please try again';
                  err.style.display = 'block';
                  setTimeout(() => { if (err) err.style.display = 'none'; }, 6000);
                }
              } else {
                // Found QDLoader — proceed with flash using that port
                selectedPort = qd.value || qd.label || selectedPort;
                if (vscode) vscode.postMessage({ command: 'flashFirmware', selectedPort: selectedPort, selectedFile: selectedFile });
              }
            } catch (e) {}
          }
        }
      }
      else if (msg && msg.command === 'pickedFile') {
        const pathEl = document.getElementById('selectedFilePath');
        if (pathEl) { pathEl.value = msg.file || '(none)'; pathEl.title = msg.file || '(none)'; }
        selectedFile = msg.file || '';
      } else if (msg && msg.command === 'flashComplete') {
        try {
          const n = document.getElementById('flashNotice');
          const e = document.getElementById('flashError');
          if (msg && msg.success) {
            if (n) n.style.display = 'block';
            if (e) e.style.display = 'none';
            if (n) setTimeout(() => { if (n) n.style.display = 'none'; }, 5000);
          } else {
            if (n) n.style.display = 'none';
            if (e) {
              e.textContent = msg && msg.reason ? `Flashing failed: ${msg.reason}` : 'Flashing failed.';
              e.style.display = 'block';
              setTimeout(() => { if (e) e.style.display = 'none'; }, 8000);
            }
          }
        } catch (err) {}
      } else if (msg && msg.command === 'portsDebug') {
        const dbg = document.getElementById('portsDebug');
        if (!dbg) return;
        dbg.style.display = 'block';
        dbg.textContent = msg.debug || '';
      }
    });

    const refreshBtn = document.getElementById('refreshPorts');
    if (refreshBtn) refreshBtn.addEventListener('click', () => { if (vscode) vscode.postMessage({ command: 'requestPorts' }); });
    const selectFileBtn = document.getElementById('selectFileBtn');
    if (selectFileBtn) selectFileBtn.addEventListener('click', () => { if (vscode) vscode.postMessage({ command: 'pickFile' }); });
    const flashBtn = document.getElementById('flashBtn');
    if (flashBtn) flashBtn.addEventListener('click', () => { triggerFlash(); });
    
    const portSelectEl = document.getElementById('portSelect');
    if(portSelectEl) {
      portSelectEl.addEventListener('change', () => { selectedPort = portSelectEl.value; });
    }
    // Signal to the extension that the webview finished loading
    try { if (vscode) vscode.postMessage({ command: 'ready' }); } catch (e) {}
  </script>
</body>
</html>
